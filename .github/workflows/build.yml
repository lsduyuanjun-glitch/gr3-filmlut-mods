name: Build release packages

# 打包 GR3 胶片固件工具为原生应用：
#   - macOS: PyInstaller 打包成 .app（双击即用，无需装 Python）
#   - Windows: PyInstaller 打包成 .exe（后续启用）
# 触发：推送 tag（v*）或手动 workflow_dispatch。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: GR3胶片工具-macOS
          # Windows 版后续启用（优化完 Mac 再编译 Win）
          # - os: windows-latest
          #   artifact: GR3胶片工具-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install capstone numpy scipy pillow unicorn==2.1.4 pyinstaller

      - name: Build with PyInstaller (macOS .app)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller gr3_tool.spec --noconfirm --clean
          ls -la dist/

      - name: Build with PyInstaller (Windows .exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller gr3_tool.spec --noconfirm --clean
          ls -la dist/

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          # .app 是目录，zip 时用 -r 保留结构，用 ditto 保留资源叉与签名
          ditto -c -k --keepParent "GR3胶片工具.app" "../GR3胶片工具-macOS.zip"
          echo "artifact=GR3胶片工具-macOS.zip" >> "$GITHUB_ENV"

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "../GR3胶片工具-Windows.zip" "GR3胶片工具" -x "*.DS_Store"
          echo "artifact=GR3胶片工具-Windows.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.artifact }}

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
