name: Build release packages

# 打包 GR3 胶片固件工具为原生应用：
#   - macOS:   PyInstaller 打包成 .app（双击即用，无需装 Python）  → gr3_tool.spec
#   - Windows: PyInstaller 打包成文件夹（含 GR3FilmTool.exe）         → gr3_tool.win.spec
# 触发：推送 main / 推送 tag（v*） / 手动 workflow_dispatch。
# 两个平台用矩阵独立构建（fail-fast:false），互不影响。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: GR3FilmTool-macOS
            spec: gr3_tool.spec
            out_dir: "GR3胶片工具.app"
          - os: windows-latest
            artifact: GR3FilmTool-Windows
            spec: gr3_tool.win.spec
            out_dir: "GR3FilmTool"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # cryptography / tifffile / colour-science 是 Windows 冻结版必需（Mac .app 用独立 python 运行时，自带）
          pip install capstone numpy scipy pillow unicorn==2.1.4 pyinstaller cryptography tifffile colour-science

      - name: Build with PyInstaller
        run: python -m PyInstaller ${{ matrix.spec }} --noconfirm --clean

      - name: Package (zip)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -r "../${{ matrix.artifact }}.zip" "${{ matrix.out_dir }}" || powershell -Command "Compress-Archive -Path '${{ matrix.out_dir }}' -DestinationPath '../${{ matrix.artifact }}.zip' -Force"
          else
            ditto -c -k --keepParent "${{ matrix.out_dir }}" "../${{ matrix.artifact }}.zip"
          fi
          echo "artifact=${{ matrix.artifact }}.zip" >> "$GITHUB_ENV"

      - name: Verify artifact integrity (block broken releases)
        shell: bash
        run: |
          python - <<'PY'
          import os, zipfile, sys
          art = "${{ matrix.artifact }}.zip"
          # 历史上因 REPO 误判导致引擎 .py / index.html 全没进包，产出「index.html 未找到」
          # 或「生成固件」ModuleNotFoundError 的坏包并被发布。这里列举固件生成所需的全部
          # 关键文件；任一缺失即故意让本 job 失败，release 不会生成。
          # 注意：models.py 等被 PyInstaller 编译进可执行体（不在 zip 里以 .py 形式出现），
          # 由 build/ 的 warn 日志确认其已被收集；此处只校验「以数据文件形式平铺进包」的文件。
          required_basenames = [
              'index.html', 'make_slots15.py', 'make_slots16.py', 'make_grain_native.py',
              'make_grain.py', 'gr3patch.py', 'armasm.py', 'codec_path.py', 'film_pipeline.py',
              'gr3_tmp.py', 'build_firmware.py', 'paths.py', 'server.py', 'license.py',
              'film_library.py', 'film_library.json',
              # 构建必需的拟合数据
              'portra400.json', 'ektar100.json', '5207.json', '5219.json',
              'gr4_std_ma.json', 'base_gamma_std.npy',
          ]
          # 子目录：必须整体存在（编译进包的 models 由 warn 日志兜底，不在此列）
          required_substrings = [
              'third_party/gr-custom-tool',
              'work/films_v16/fits/duccio',
              'work/ma_probe5',
          ]
          if not os.path.exists(art):
              print("FATAL: artifact %s not found" % art); sys.exit(1)
          names = zipfile.ZipFile(art).namelist()
          base = {os.path.basename(n) for n in names}
          missing_b = [r for r in required_basenames if r not in base]
          missing_s = [s for s in required_substrings if not any(s in n for n in names)]
          if missing_b or missing_s:
              print("FATAL: %s is MISSING required files -> basenames:%s substrings:%s — would ship a broken build. Failing on purpose." % (art, missing_b, missing_s))
              sys.exit(1)
          print("OK: %s contains all %d required files + %d required subtrees" % (art, len(required_basenames), len(required_substrings)))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.artifact }}

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 创建 Release 需要向仓库写入内容的权限；默认 GITHUB_TOKEN 没有，必须显式授予
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
