name: Build release packages

# 打包 GR3 胶片固件工具为原生应用：
#   - macOS:   PyInstaller 打包成 .app（双击即用，无需装 Python）  → gr3_tool.spec
#   - Windows: PyInstaller 打包成文件夹（含 GR3FilmTool.exe）         → gr3_tool.win.spec
# 触发：推送 main / 推送 tag（v*） / 手动 workflow_dispatch。
# 两个平台用矩阵独立构建（fail-fast:false），互不影响。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: GR3FilmTool-macOS
            spec: gr3_tool.spec
            out_dir: "GR3胶片工具.app"
          - os: windows-latest
            artifact: GR3FilmTool-Windows
            spec: gr3_tool.win.spec
            out_dir: "GR3FilmTool"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # cryptography / tifffile / colour-science 是 Windows 冻结版必需（Mac .app 用独立 python 运行时，自带）
          pip install capstone numpy scipy pillow unicorn==2.1.4 pyinstaller cryptography tifffile colour-science

      - name: Build with PyInstaller
        run: python -m PyInstaller ${{ matrix.spec }} --noconfirm --clean

      - name: Package (zip)
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -r "../${{ matrix.artifact }}.zip" "${{ matrix.out_dir }}" || powershell -Command "Compress-Archive -Path '${{ matrix.out_dir }}' -DestinationPath '../${{ matrix.artifact }}.zip' -Force"
          else
            ditto -c -k --keepParent "${{ matrix.out_dir }}" "../${{ matrix.artifact }}.zip"
          fi
          echo "artifact=${{ matrix.artifact }}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.artifact }}

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
